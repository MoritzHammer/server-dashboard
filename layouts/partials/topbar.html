    <header class="noc-topbar">
      <div class="topbar-brand">
        <span class="mark" aria-hidden="true">
          <svg width="140" height="136" viewBox="0 0 140 136" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="70" cy="44" r="42" fill="#F4B41A"/>
            <circle cx="45" cy="87" r="42" fill="#08B4C4"/>
            <circle cx="95" cy="87" r="42" fill="#E2366E"/>
          </svg>
        </span>
        <span class="brand-title">MORITZ HAMMER · NOC</span>
        <span class="brand-sub" id="topbar-host-sub">192.168.178.90</span>
      </div>

      <div class="global-verdict" id="global-verdict" role="status" aria-live="polite">
        <span class="verdict-led" aria-hidden="true"></span>
        <span id="global-verdict-text">VERBINDE MIT LIVE-TELEMETRIE…</span>
      </div>

      <div class="topbar-controls">
        <!-- Tablet vs. Desktop Layout Switcher -->
        <div class="pill-group" role="group" aria-label="Darstellungsmodus">
          <button type="button" class="pill-btn mode-btn" id="btn-mode-tablet" data-layout="tablet" aria-pressed="true" title="8–10 Zoll Tablet-Kiosk (100dvh, kein Scrollen)">Tablet</button>
          <button type="button" class="pill-btn mode-btn" id="btn-mode-desktop" data-layout="desktop" aria-pressed="false" title="Desktop-Vollansicht mit Live-Fenstern für Beszel, Kuma &amp; WUD">Desktop</button>
        </div>

        <!-- View Tabs (in Tablet mode switches full view; in Desktop mode jumps or switches to Blueprint) -->
        <div class="pill-group" role="group" aria-label="Bereich wählen">
          <button type="button" class="pill-btn" data-tab="noc" aria-pressed="true">NOC</button>
          <button type="button" class="pill-btn" data-tab="windows" aria-pressed="false">Beszel &amp; Kuma</button>
          <button type="button" class="pill-btn" data-tab="wud" aria-pressed="false" id="tab-btn-wud">WUD</button>
          <button type="button" class="pill-btn" data-tab="blueprint" aria-pressed="false">Grafana</button>
        </div>

        <!-- Live / Alarm-Test -->
        <div class="pill-group" role="group" aria-label="Datenquelle">
          <button type="button" class="pill-btn sim-live" data-sim="live" id="btn-mode-live" aria-pressed="true">● Live</button>
          <button type="button" class="pill-btn sim-warn" data-sim="warn" aria-pressed="false" title="Alarm-Test Warnung">▲</button>
          <button type="button" class="pill-btn sim-crit" data-sim="crit" aria-pressed="false" title="Alarm-Test Kritisch">■</button>
        </div>

        <button type="button" class="pill-btn" id="btn-kiosk-fs" aria-pressed="false" title="Vollbild &amp; Screen Wake-Lock">⛶</button>

        <div class="noc-clock-box">
          <span id="noc-clock">--:--:--</span>
          <span class="noc-clock-sub" id="noc-refresh-label">LIVE 5S</span>
        </div>
      </div>
    </header>
