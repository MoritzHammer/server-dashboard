services:
  noc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    environment:
      - TZ=Europe/Berlin
      - HOST_IP=${HOST_IP:-192.168.178.90}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      # Kritische Dienste (Standard: Vaultwarden, Immich, Paperless-ngx, Nginx Proxy Manager, Uptime Kuma, Website)
      - CRITICAL_SERVICES=${CRITICAL_SERVICES:-}
      - EXTRA_SERVICES=${EXTRA_SERVICES:-}
      - HOSTS=${HOSTS:-}
      - SSL_DOMAINS=${SSL_DOMAINS:-info.moritzhammer.org}
      # Uptime Kuma (Live-Metriken + eingebettetes Fenster)
      - UPTIME_KUMA_URL=${UPTIME_KUMA_URL:-http://192.168.178.90:3001}
      - UPTIME_KUMA_EMBED_URL=${UPTIME_KUMA_EMBED_URL:-}
      - UPTIME_KUMA_API_KEY=${UPTIME_KUMA_API_KEY:-}
      - UPTIME_KUMA_STATUS_SLUG=${UPTIME_KUMA_STATUS_SLUG:-}
      # Beszel (Live-Fenster + optional PocketBase Multi-Host API)
      - BESZEL_URL=${BESZEL_URL:-http://192.168.178.90:8090}
      - BESZEL_EMBED_URL=${BESZEL_EMBED_URL:-}
      - BESZEL_EMAIL=${BESZEL_EMAIL:-}
      - BESZEL_PASSWORD=${BESZEL_PASSWORD:-}
      # WUD / What's Up Docker (wird automatisch via Docker-Socket erkannt oder hier manuell setzen)
      - WUD_URL=${WUD_URL:-}
      - WUD_USER=${WUD_USER:-}
      - WUD_PASS=${WUD_PASS:-}
      # Optional: Dozzle & Prometheus
      - DOZZLE_URL=${DOZZLE_URL:-http://192.168.178.90:8888}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
