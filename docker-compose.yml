services:
  noc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/class/net:/host/sys/class/net:ro
    environment:
      - TZ=Europe/Berlin
      - HOST_IP=${HOST_IP:-192.168.178.90}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      # Kritische Dienste (Standard: Vaultwarden, Immich, Paperless-ngx, Nginx Proxy Manager, Uptime Kuma, Website)
      - CRITICAL_SERVICES=${CRITICAL_SERVICES:-}
      - EXTRA_SERVICES=${EXTRA_SERVICES:-}
      - HOSTS=${HOSTS:-}
      - SSL_DOMAINS=${SSL_DOMAINS:-info.moritzhammer.org}
      # Uptime Kuma (Live-Statusseite /status/overview + Same-Origin Proxy)
      - UPTIME_KUMA_URL=${UPTIME_KUMA_URL:-http://192.168.178.90:3001}
      - UPTIME_KUMA_STATUS_SLUG=${UPTIME_KUMA_STATUS_SLUG:-overview}
      - UPTIME_KUMA_EMBED_URL=${UPTIME_KUMA_EMBED_URL:-http://192.168.178.90:3001/status/overview}
      - UPTIME_KUMA_API_KEY=${UPTIME_KUMA_API_KEY:-}
      # Beszel (Live-Systemseite Port 8099 + Same-Origin Proxy + optional PocketBase API)
      - BESZEL_URL=${BESZEL_URL:-http://192.168.178.90:8099}
      - BESZEL_EMBED_URL=${BESZEL_EMBED_URL:-http://192.168.178.90:8099/system/n9qil9mgcw9fhwm}
      - BESZEL_EMAIL=${BESZEL_EMAIL:-}
      - BESZEL_PASSWORD=${BESZEL_PASSWORD:-}
      # Integrierter Same-Origin-Proxy entfernt X-Frame-Options/CSP automatisch für Beszel & Kuma
      - ENABLE_EMBED_PROXY=${ENABLE_EMBED_PROXY:-true}
      # WUD / What's Up Docker (automatische Port-Erkennung via Docker Socket oder manuell setzen)
      - WUD_URL=${WUD_URL:-}
      - WUD_USER=${WUD_USER:-}
      - WUD_PASS=${WUD_PASS:-}
      # Optional: Dozzle & Prometheus
      - DOZZLE_URL=${DOZZLE_URL:-http://192.168.178.90:8888}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
