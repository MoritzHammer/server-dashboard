# ─── ZEILE 5: WARNUNGEN / INCIDENTS (MAXIMAL 5 RELEVANTE EREIGNISSE) ───
incidents:
  - level: "info"
    badge: "INFO"
    title: "Warte auf erste Live-Antwort von /api/status"
    meta: "Docker Engine · Host /proc · Uptime Kuma · Beszel · WUD"
    time: "SYNC"

# ─── GRAFANA & PROMETHEUS ARCHITEKTUR-BLUEPRINT ───
blueprint:
  layout_rows:
    - row: "Zeile 1 · Executive Summary"
      grid: "y=0, h=4 (4 Panels à w=6 auf 24er-Grid)"
      panel_type: "Grafana Stat Panel (Big Value, Color Mode: Background Solid, Sparkline: Disabled)"
      goal: "In < 1 Sekunde aus 3 Metern Entfernung erkennbar: Dienste online (Uptime Kuma), Hosts online (Beszel), Container healthy (Docker/Dozzle), SSL OK."
    - row: "Zeile 2 · Kritische Dienste"
      grid: "y=4, h=4 (6 Panels à w=4 oder 1 State-Matrix-Panel w=24)"
      panel_type: "Stat Panel / State Timeline (Current Value Only)"
      goal: "Binäre Farblogik ohne Zwischenfarben: Grün (#10B981) = Online (1), Rot (#EF4444) = Offline (0) für Vaultwarden, Immich, Paperless-ngx, Nginx Proxy Manager, Uptime Kuma und Website."
    - row: "Zeile 3 · Infrastrukturzustand"
      grid: "y=8, h=5 (3 Gauge-Panels à w=6 + 1 Netzwerk-Panel w=6)"
      panel_type: "Gauge Panel für CPU/RAM/Datenträger + Stat/Sparkline (15 Min.) für Netzwerk"
      goal: "Sofortige Engpass-Erkennung nach strengen Schwellwerten (CPU 70/85 %, RAM 75/90 %, Disk 80/90 %)."
    - row: "Zeile 4 · Container-Gesundheit & WUD Updates"
      grid: "y=13, h=4 (4 Stat-Kacheln + kompakte Restart/Update-Liste)"
      panel_type: "Stat Panel (Healthy, Unhealthy, Restarts, WUD Updates) + Bar Gauge (Top Restarts)"
      goal: "Crash-Loops und ausstehende Docker-Image-Updates (inkl. Warnung bei DB-Apps wie Immich/Paperless) sofort sehen."
    - row: "Zeile 5 · Warnungen / Incidents"
      grid: "y=17, h=4 (Volle Breite w=24, max. 5 Einträge)"
      panel_type: "Alert List Panel (Grafana Unified Alerting) oder Table Panel (Limit 5)"
      goal: "Maximal 5 priorisierte Vorfälle (Rot = Kritisch, Gelb = Warnung, Blau = Information) ohne Scrollbalken."

  color_palette:
    - name: "OK / Online / Healthy"
      hex: "#10B981"
      usage: "Standardzustand für alle laufenden Dienste, Hosts, Container und Ressourcen unterhalb der Warnschwelle."
    - name: "Warnung / Updates"
      hex: "#F59E0B"
      usage: "CPU 70–85 %, RAM 75–90 %, Disk 80–90 %, Container-Restarts > 0, WUD Updates verfügbar, SSL-Ablauf < 21 Tage."
    - name: "Kritisch / Offline / Alarm"
      hex: "#EF4444"
      usage: "Dienst/Host Offline (0), Unhealthy Container > 0, CPU > 85 %, RAM > 90 %, Disk > 90 %, Backup fehlgeschlagen."
    - name: "Information / Neutral"
      hex: "#38BDF8"
      usage: "Informative Events, Netzwerk-Traffic (Inbound Cyan #08B4C4, Outbound Magenta #E2366E)."
    - name: "NOC Hintergrund & Panels"
      hex: "#0B0F17 / #121826"
      usage: "AMOLED-schonendes Tiefdunkel für 24/7-Tablet-Dauerbetrieb ohne Überstrahlung bei Nacht."

  promql_examples:
    - title: "1. Dienste Online (Uptime Kuma /metrics)"
      source: "Uptime Kuma"
      panel: "Stat Panel (Online / Gesamt)"
      query: |
        # Online Dienste:
        count(monitor_status{job="uptime-kuma"} == 1)
        # Gesamtanzahl überwachter Dienste:
        count(monitor_status{job="uptime-kuma"})
    - title: "2. Kritische Dienste (Binär: 1 = Grün, 0 = Rot)"
      source: "Uptime Kuma"
      panel: "Stat Panel · Value Mapping: 1 → ONLINE, 0 → OFFLINE"
      query: |
        monitor_status{
          job="uptime-kuma",
          monitor_name=~"Vaultwarden|Immich|Paperless-ngx|Nginx Proxy Manager|Uptime Kuma|Website"
        }
    - title: "3. SSL-Zertifikate kürzeste Restlaufzeit"
      source: "Uptime Kuma"
      panel: "Stat Panel · >= 15 → OK (Grün), 7–14 → WARNUNG (Gelb), < 7 → KRITISCH (Rot)"
      query: |
        min(monitor_cert_days_remaining{job="uptime-kuma"})
    - title: "4. CPU-Auslastung auf 192.168.178.90 (< 70 % / 70–85 % / > 85 %)"
      source: "Node Exporter"
      panel: "Gauge Panel"
      query: |
        100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle", instance="192.168.178.90:9100"}[2m])) * 100)
    - title: "5. Arbeitsspeicher in % (< 75 % / 75–90 % / > 90 %)"
      source: "Node Exporter"
      panel: "Gauge Panel"
      query: |
        (1 - (node_memory_MemAvailable_bytes{instance="192.168.178.90:9100"} / node_memory_MemTotal_bytes{instance="192.168.178.90:9100"})) * 100
    - title: "6. Datenträger-Belegung in % (< 80 % / 80–90 % / > 90 %)"
      source: "Node Exporter"
      panel: "Gauge Panel"
      query: |
        100 - ((node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}) * 100)
    - title: "7. Netzwerk Inbound / Outbound (Bit/s)"
      source: "Node Exporter"
      panel: "Stat + Sparkline (letzte 15 Min.)"
      query: |
        # Inbound:
        rate(node_network_receive_bytes_total{device=~"eth0|eno1|ens18"}[2m]) * 8
        # Outbound:
        rate(node_network_transmit_bytes_total{device=~"eth0|eno1|ens18"}[2m]) * 8
    - title: "8. Container Restarts & WUD Updates"
      source: "WUD / Prometheus"
      panel: "Stat Panels & Bar Gauge"
      query: |
        # WUD verfügbare Container-Updates (wenn WUD Prometheus-Trigger aktiv):
        sum(wud_container_update_available == 1)
        # Top Container-Restarts (24h):
        topk(5, round(increase(container_start_time_seconds{name!=""}[24h]) > 0))

  plugins:
    - name: "100 % Native Grafana Core Panels (Empfohlen)"
      type: "Core (Grafana 10 / 11)"
      desc: "Stat, Gauge, Bar Gauge, State Timeline und Alert List decken alle 5 Zeilen ohne externe Plugin-Abhängigkeiten ab — extrem schnell auf ARM-Tablets."
    - name: "Infinity Datasource (yesoreyeram-infinity-datasource)"
      type: "Optional · REST-JSON-Brücke"
      desc: "Kann direkt /api/status dieses NOC-Containers, WUD (/api/containers) oder Beszel-API in Grafana visualisieren."

  tablet_kiosk:
    - title: "Tablet- vs. Desktop-Modus direkt umschaltbar"
      detail: "Oben in der Leiste zwischen 📱 Tablet (100dvh Kiosk ohne Scrollen) und 🖥 Desktop (Vollansicht mit Live-Fenstern für Beszel & Uptime Kuma sowie WUD-Update-Tabelle) umschalten."
    - title: "Uptime Kuma im HTML-Fenster (Iframe-Hinweis)"
      detail: "Falls der Browser Uptime Kuma im Iframe blockt: In Uptime Kuma unter Einstellungen → Sicherheit den Iframe-Schutz (X-Frame-Options) deaktivieren oder die öffentliche Statusseite (/status/...) nutzen."
    - title: "Fully Kiosk Browser (Android 8–10 Zoll)"
      detail: "URL http://192.168.178.90:3000 öffnen, Keep Screen On + Motion Detection aktivieren und Vollbildmodus einschalten."
    - title: "WUD Update-Strategie (Datenbank-Sicherheit)"
      detail: "Datenbank-kritische Stacks (Immich, Paperless-ngx, Vaultwarden, Authelia, Nginx Proxy Manager) werden im WUD-Panel automatisch mit einem Backup-Hinweis markiert, damit Major-Updates nicht blind ausgerollt werden."
