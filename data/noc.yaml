# ─── ZEILE 1: EXECUTIVE SUMMARY (4 GROSSE STAT-PANELS) ───
executive_summary:
  - id: "services-online"
    row_idx: "01"
    label: "Dienste online"
    value: "6 / 6"
    source: "Uptime Kuma"
    status: "ok"
    sub: "100 % Verfügbarkeit · Live geprüft"
  - id: "hosts-online"
    row_idx: "02"
    label: "Hosts online"
    value: "1 / 1"
    source: "Beszel"
    status: "ok"
    sub: "Docker-Host 192.168.178.90"
  - id: "containers-healthy"
    row_idx: "03"
    label: "Container healthy"
    value: "14 / 14"
    source: "Docker Engine"
    status: "ok"
    sub: "Docker Healthchecks aktiv"
  - id: "ssl-status"
    row_idx: "04"
    label: "SSL-Zertifikate"
    value: "OK"
    source: "Live TLS"
    status: "ok"
    sub: "info.moritzhammer.org"

# ─── ZEILE 2: KRITISCHE DIENSTE (NUR MORITZ' ECHTE SERVICES — KEIN GITEA / KEIN TRAEFIK) ───
critical_services:
  - id: "vaultwarden"
    name: "Vaultwarden"
    category: "Passwort-Manager"
    endpoint: "http://192.168.178.90:8081"
    latency: "4 ms"
    online: true
  - id: "immich"
    name: "Immich"
    category: "Fotoverwaltung"
    endpoint: "http://192.168.178.90:2283"
    latency: "8 ms"
    online: true
  - id: "paperless-ngx"
    name: "Paperless-ngx"
    category: "Dokumente"
    endpoint: "http://192.168.178.90:8000"
    latency: "6 ms"
    online: true
  - id: "nginx-proxy-manager"
    name: "Nginx Proxy Manager"
    category: "Reverse Proxy & SSL"
    endpoint: "http://192.168.178.90:81"
    latency: "3 ms"
    online: true
  - id: "uptime-kuma"
    name: "Uptime Kuma"
    category: "Monitoring"
    endpoint: "http://192.168.178.90:3001"
    latency: "5 ms"
    online: true
  - id: "website"
    name: "Website"
    category: "info.moritzhammer.org"
