# ─── ZEILE 3: INFRASTRUKTURZUSTAND ───
infrastructure:
  gauges:
    - id: "cpu"
      label: "CPU-Last"
      value: 24
      unit: "%"
      source: "Host /proc · Beszel"
      thresholds_label: "Grün < 70 % · Gelb 70–85 % · Rot > 85 %"
      warn_at: 70
      crit_at: 85
      detail: "Docker-Host 192.168.178.90"
    - id: "ram"
      label: "Arbeitsspeicher"
      value: 52
      unit: "%"
      source: "Host /proc · Beszel"
      thresholds_label: "Grün < 75 % · Gelb 75–90 % · Rot > 90 %"
      warn_at: 75
      crit_at: 90
      detail: "Live RAM-Auslastung"
    - id: "disk"
      label: "Datenträger"
      value: 58
      unit: "%"
      source: "Host Root-FS"
      thresholds_label: "Grün < 80 % · Gelb 80–90 % · Rot > 90 %"
      warn_at: 80
      crit_at: 90
      detail: "Live Speicherbelegung"
  network:
    label: "Netzwerk-Durchsatz"
    source: "NIC eth0"
    inbound: "12.4 Mbit/s"
    outbound: "4.2 Mbit/s"
    status: "ok"

# ─── ZEILE 4: CONTAINER-GESUNDHEIT & WUD UPDATES ───
container_health:
  source: "Docker Engine Socket & WUD"
  healthy: 14
  unhealthy: 0
  restarts_24h: 0
  wud_updates: 0
  top_restarts: []

